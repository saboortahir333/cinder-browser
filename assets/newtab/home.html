<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <main class="home-container">
    <div class="home-content">

      <div class="logo-block">
        <svg class="browser-logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Cinder Browser">
          <circle cx="32" cy="32" r="28" fill="var(--accent)" opacity="0.12" />
          <path d="M32 12C20.954 12 12 20.954 12 32C12 43.046 20.954 52 32 52C43.046 52 52 43.046 52 32C52 20.954 43.046 12 32 12ZM32 16C39.638 16 46.042 21.438 47.608 28.667C45.312 26.973 42.474 26 39.4 26C31.558 26 25.2 32.358 25.2 40.2C25.2 41.745 25.446 43.235 25.901 44.629C20.089 42.617 16 37.766 16 32C16 23.163 23.163 16 32 16Z" fill="var(--accent)" />
          <circle cx="38" cy="38" r="8" fill="var(--accent)" />
        </svg>
        <span class="logo-wordmark">Cinder</span>
      </div>

      <form class="search-bar" role="search" id="search-form">
        <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search the web"
          aria-label="Search the web"
          autocomplete="off"
        />
      </form>

      <section class="top-sites" aria-label="Top sites">
        <ul class="top-sites-grid" id="top-sites-grid">
          <!-- Populated dynamically by home.js with top site tiles and add shortcut tile -->
        </ul>
      </section>

    </div>
  </main>

  <script src="home.js"></script>
</body>
</html>
