<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="emberOuter" x1="0%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#8a1f0f"/>
      <stop offset="45%" stop-color="#d84315"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </linearGradient>

    <linearGradient id="emberInner" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#d84315"/>
      <stop offset="55%" stop-color="#ff8f3f"/>
      <stop offset="100%" stop-color="#ffd27a"/>
    </linearGradient>

    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7e6"/>
      <stop offset="55%" stop-color="#ffd27a"/>
      <stop offset="100%" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- ambient glow behind the mark -->
  <circle cx="400" cy="380" r="220" fill="url(#core)" filter="url(#softBlur)" opacity="0.5"/>

  <!-- outer ember petal (left, deep red-orange) -->
  <path d="M400 210
           C 300 250, 240 350, 260 460
           C 275 540, 335 590, 400 600
           C 355 540, 340 470, 365 410
           C 380 370, 405 340, 400 210 Z"
        fill="url(#emberOuter)"/>

  <!-- outer ember petal (right, mirrored) -->
  <path d="M400 210
           C 500 250, 560 350, 540 460
           C 525 540, 465 590, 400 600
           C 445 540, 460 470, 435 410
           C 420 370, 395 340, 400 210 Z"
        fill="url(#emberOuter)" opacity="0.92"/>

  <!-- inner flame (bright core petal) -->
  <path d="M400 270
           C 345 320, 320 390, 340 450
           C 352 490, 375 520, 400 535
           C 425 520, 448 490, 460 450
           C 480 390, 455 320, 400 270 Z"
        fill="url(#emberInner)"/>

  <!-- hot core dot -->
  <circle cx="400" cy="440" r="34" fill="url(#core)"/>
</svg>
