name: Release (build + SignPath signing)

# Runs when you push a version tag such as v1.0.0 (or manually).
# Required repository settings (Settings > Secrets and variables > Actions):
#   secret   SIGNPATH_API_TOKEN          API token of a SignPath CI user
#   variable SIGNPATH_ORGANIZATION_ID    from your SignPath organisation page
# SignPath project slug / policies are set below.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write      # attach the installer to the GitHub release
  id-token: write      # SignPath verifies the build origin

env:
  SIGNPATH_PROJECT_SLUG: cinder-browser
  SIGNPATH_POLICY_SLUG: release-signing

jobs:
  build-sign:
    # Only run once SignPath is configured; otherwise a tag push would fail at signing.
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Windows release
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter test
          flutter build windows --release

      # ---- round 1: sign the app's own binaries ------------------------------
      - name: Zip release folder
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath release-files.zip

      - id: upload-release
        uses: actions/upload-artifact@v4
        with:
          name: release-files-unsigned
          path: release-files.zip

      - name: Sign app binaries (SignPath)
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ env.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ env.SIGNPATH_POLICY_SLUG }}'
          artifact-configuration-slug: release-files
          github-artifact-id: '${{ steps.upload-release.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: signed-release

      - name: Replace unsigned binaries with signed ones
        shell: pwsh
        run: |
          Expand-Archive signed-release\*.zip -DestinationPath build\windows\x64\runner\Release -Force

      # ---- round 2: build the installer around the signed files ---------------
      - name: Fetch Microsoft redistributables (signature-checked)
        shell: pwsh
        run: .\tools\fetch_installer_deps.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.4.3 -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          Compress-Archive CinderBrowser_Setup.exe -DestinationPath installer.zip

      - id: upload-installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: installer.zip

      - name: Sign installer (SignPath)
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ env.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ env.SIGNPATH_POLICY_SLUG }}'
          artifact-configuration-slug: installer
          github-artifact-id: '${{ steps.upload-installer.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: signed-installer

      - name: Verify signature
        shell: pwsh
        run: |
          Expand-Archive signed-installer\*.zip -DestinationPath dist -Force
          $s = Get-AuthenticodeSignature dist\CinderBrowser_Setup.exe
          $s | Format-List Status, StatusMessage, @{n='Signer';e={$_.SignerCertificate.Subject}}
          if ($s.Status -ne 'Valid') { throw "Installer signature is $($s.Status)" }

      - uses: actions/upload-artifact@v4
        with:
          name: CinderBrowser_Setup-signed
          path: dist\CinderBrowser_Setup.exe

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CinderBrowser_Setup.exe
